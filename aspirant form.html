<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>Faculty Of Computing Aspirant</h1>
            <p>Admission Biometric Data Capture Portal</p>
        </header>

        <form action="#" method="POST">
            <label for="first name">First Name:   </label>
            <input type="text" id="First Name">
        </form>
        <form action="#" method="POST">
            <label for="Middle Name">Middle Name:</label>
            <input type="text" id="Middle Name" >
        </form>
        <form action="#" method="POST">
            <label for="Last Name">Last Name:</label>
            <input type="text" id="Last Name" >
        </form>

        <form action="#" method="POST">
            <label for="age">Age</label>
            <select name="age" id="age">
                <option value="16">16</option>
                <option value="17">17</option>
                <option value="18">18</option>
                <option value="19">19</option>
            </select>
        <form action="#" method="POST">
                <label for="Date">Date</label>
                <input type="text" id="Date">
            </form>
            <form action="#" method="POST">
                <label for="Gender">Gender</label>
            <select name="Gender" id="Gender">
                <option value="male">Male</option>
                <option value="Female">Female</option>
                <option value="hidden">Prefer not to say</option>
            </select>
            </form>

            </form>
            <header>
                <p>CONTACT</p>
            </header>
            <form action="Contact" method="POST">
                <label for="email">Email</label>
                <input type="email" id="email">
            </form>
            <form action="#" method="POST">
                <label for="phone ">Phone</label>
                <input type="Phone Number" id="Phone Number">
            </form>
            <form action="#" method="POST">
                <label for="course of study">Desire Course Of Study</label>
                <select name="courses" id="Desire Course Of Study">
                    <option value="Computer Science">Computer Science</option>
                    <option value="Software Programming">Software Programming</option>
                    <option value="Information Science">Information Science</option>
                    <option value="Data Science">Data Science</option>
                </select>
            </form>
    <button type="button">submit</button>
    
</body>
</html>
